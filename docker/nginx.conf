upstream api {
    server studio_testing_backend:8000;
}

log_format with_timing '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time '
                        'uct=$upstream_connect_time '
                        'uht=$upstream_header_time '
                        'urt=$upstream_response_time';

server {

    listen 80;
    # server_name auraestudiopilates.com www.auraestudiopilates.com;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log with_timing;
    error_log /var/log/nginx/error.log warn;

    # ======================
    # SECURITY HEADERS
    # ======================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Content-Security-Policy "default-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval' https:;" always;

    # ======================
    # PROXY DJANGO
    # ======================

    location / {
        proxy_pass http://api;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_redirect off;
    }

    # ======================
    # STATIC FILES
    # ======================

    location /static/ {
        alias /studio/static/;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ======================
    # MEDIA FILES
    # ======================

    location /media/ {
        alias /studio/media/;

        expires 7d;
        add_header Cache-Control "public";
    }

    # ======================
    # PROTECCIONES BÁSICAS
    # ======================

    location ~ /\. {
        deny all;
    }

    location ~* \.(env|ini|log|sh|sql)$ {
        deny all;
    }
}